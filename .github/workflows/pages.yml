# Builds the site with the same Jekyll/gem versions as local dev (Gemfile.lock + .ruby-version)
# and deploys it to GitHub Pages. Requires Settings → Pages → Source = "GitHub Actions".
#
# Actions are pinned to commit SHAs (version in the trailing comment) so a moved tag can't change what runs.
name: Build and deploy site

on:
  push:
    branches: [master]
  # PRs (e.g. Dependabot) get the build + checks only; nothing is deployed until merged.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Phone photos/videos embed GPS coordinates; never publish them. Standard-library Python, no install needed.
      - name: Check media for location metadata
        run: python3 scripts/check-media-privacy.py assets images downloads

      - name: Set up Ruby (version from .ruby-version, gems cached)
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Blocks the deploy if any internal link, image or anchor is broken.
      # External links are skipped (slow and flaky); missing alt text is tracked separately.
      - name: Check internal links and images
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https --ignore-missing-alt

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

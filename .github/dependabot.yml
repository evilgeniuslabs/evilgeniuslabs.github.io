# Batches dependency updates so they arrive as one PR per ecosystem instead of one per gem.
# Every merge deploys through the Pages workflow, which builds and runs html-proofer first.
version: 2
updates:
  # Jekyll toolchain (build-time only; nothing here ships to visitors)
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      gem-security:
        applies-to: security-updates
        patterns: ["*"]
      gems:
        applies-to: version-updates
        patterns: ["*"]

  # Workflow actions are pinned to SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

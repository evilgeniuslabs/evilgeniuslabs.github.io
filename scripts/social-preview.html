<!--
  Source for images/social-preview.jpg (1200×630 default link-preview image). To regenerate, from the repo root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --screenshot=/tmp/card.png "file://$PWD/scripts/social-preview.html"
    magick /tmp/card.png -strip -quality 88 -sampling-factor 4:4:4 images/social-preview.jpg
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    /* Slate: body #272b30, navbar #3a3f44 */
    background: radial-gradient(ellipse 90% 120% at 30% 40%, #3a3f44 0%, #272b30 70%);
    color: #fff;
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 64px;
  }
  img { height: 400px; width: auto; display: block; }
  h1 { margin: 0; font-size: 92px; font-weight: 700; line-height: 1.02; letter-spacing: -1px; }
  p { margin: 28px 0 0; font-size: 36px; color: #c8ccd0; }
  .url { margin-top: 44px; font-size: 26px; color: #8a9096; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <img src="../images/egl-light-bulb-white.svg" alt="">
  <div>
    <h1>Evil Genius<br>Labs</h1>
    <p>Purveyor of finely hand-crafted pixels.</p>
    <div class="url">evilgeniuslabs.org</div>
  </div>
</body>
</html>

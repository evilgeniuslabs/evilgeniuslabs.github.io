---
title: Grid
sitemap: false
---

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  {% include csp.html %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="alternate" type="application/rss+xml" title="Evil Genius Labs" href="/feed.xml" />

  <title>Evil Genius Labs | {{ page.title }}</title>

  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" href="/css/slate.bootstrap.min.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Google tag (gtag.js) -->
  <script src="/js/analytics.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z2H3D662QK"></script>
</head>

<body style="background-color: black;">

  <div class="container-fluid">

    <div class="row row-no-gutters">
      {% for post in site.data.grid %}
      <div class="col-xs-4">
        <div class="embed-responsive embed-responsive-16by9">
          <a href="{{ post.url }}">
            <video class="post" data-poster="/assets/{{ post.imgurId }}.jpg" autoplay muted loop playsinline
              data-src="/assets/{{ post.imgurId }}.mp4"></video>
          </a>
        </div>
      </div>
      {% endfor %}
    </div>

  </div>

  <script src="/js/site.js"></script>
</body>

</html>

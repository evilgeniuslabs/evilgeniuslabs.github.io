<blockquote cite="https://en.wikipedia.org/wiki/Fermat%27s_spiral">
<p>In disc <a href="https://en.wikipedia.org/wiki/Phyllotaxis">phyllotaxis</a>, as in the <a href="https://en.wikipedia.org/wiki/Sunflower">sunflower</a> and daisy, the mesh of spirals occurs in <a href="https://en.wikipedia.org/wiki/Fibonacci_number">Fibonacci numbers</a> because divergence (angle of succession in a single spiral arrangement) approaches the <a href="https://en.wikipedia.org/wiki/Golden_ratio">golden ratio</a>. The shape of the spirals depends on the growth of the elements generated sequentially. In mature-disc phyllotaxis, when all the elements are the same size, the shape of the spirals is that of Fermat spirals—ideally. That is because Fermat's spiral traverses equal <a href="https://en.wikipedia.org/wiki/Annulus_(mathematics)">annuli</a> in equal turns. The full model proposed by H Vogel in 1979<sup><a href="https://en.wikipedia.org/wiki/Fermat%27s_spiral#cite_note-2">[2]</a></sup> is</p>
<math display="block"><mi>r</mi><mo>=</mo><mi>c</mi><msqrt><mi>n</mi></msqrt><mo>,</mo></math>
<math display="block"><mi>θ</mi><mo>=</mo><mi>n</mi><mo>×</mo><mn>137.508</mn><mo>°</mo><mo>,</mo></math>
<p>where <i>θ</i> is the angle, <i>r</i> is the radius or distance from the center, and <i>n</i> is the index number of the floret and <i>c</i> is a constant scaling factor. The angle 137.508° is the <a href="https://en.wikipedia.org/wiki/Golden_angle">golden angle</a> which is approximated by ratios of Fibonacci numbers.<sup><a href="https://en.wikipedia.org/wiki/Fermat%27s_spiral#cite_note-3">[3]</a></sup></p>
</blockquote>
